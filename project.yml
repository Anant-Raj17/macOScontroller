name: PadControl
options:
  bundleIdPrefix: dev.anantraj
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEAD_CODE_STRIPPING: YES
targets:
  PadControl:
    type: application
    platform: macOS
    sources:
      - path: PadControl
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.anantraj.PadControl
        PRODUCT_NAME: PadControl
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PadControl/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: PadControl
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Anant Raj"
        CODE_SIGN_ENTITLEMENTS: PadControl/PadControl.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []
schemes:
  PadControl:
    build:
      targets:
        PadControl: all
    run:
      config: Debug
      commandLineArguments:
        "-NSDocumentRevisionsDebugMode": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
